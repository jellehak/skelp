<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Files</title>
  <style>
    :root { color-scheme: dark; font: 13px/1.4 var(--font, sans-serif); background: var(--bg, #0b0d0e); color: var(--text, #eef1eb); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg, #0b0d0e); }
    button { font: inherit; }
    .toolbar { display: flex; align-items: center; gap: 8px; min-height: 43px; padding: 0 10px; border-bottom: 1px solid var(--border, #26302f); }
    .path { min-width: 0; overflow: hidden; color: var(--text-muted, #84908b); font-family: var(--mono, monospace); text-overflow: ellipsis; white-space: nowrap; }
    .back { width: 26px; height: 26px; flex: 0 0 auto; border: 1px solid var(--border, #26302f); border-radius: var(--radius-sm, 5px); background: var(--surface, #151b1b); color: var(--text, #eef1eb); cursor: pointer; }
    .back:disabled { opacity: .35; cursor: default; }
    .files { list-style: none; margin: 0; padding: 5px; }
    .entry { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 8px; width: 100%; min-height: 34px; padding: 0 7px; border: 0; border-radius: 4px; background: transparent; color: var(--text, #eef1eb); text-align: left; cursor: pointer; }
    .entry:hover { background: var(--surface-hover, #1d2726); }
    .entry-icon { color: var(--accent, #9bd6c4); font-family: var(--mono, monospace); }
    .entry-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .entry-meta { color: var(--text-muted, #84908b); font: 10px var(--mono, monospace); }
    .empty, .error { padding: 18px 12px; color: var(--text-muted, #84908b); font-family: var(--mono, monospace); }
    .error { color: #dc8067; }
  </style>
</head>
<body>
  <div class="toolbar"><button id="back" class="back" title="Back" aria-label="Back">&larr;</button><div id="path" class="path">.</div></div>
  <main id="content"></main>
  <script>
    const content = document.getElementById('content');
    const pathLabel = document.getElementById('path');
    const backButton = document.getElementById('back');
    let currentPath = '.';

    function formatSize(size) {
      if (size < 1024) return `${size} B`;
      if (size < 1024 * 1024) return `${Math.round(size / 1024)} KB`;
      return `${(size / (1024 * 1024)).toFixed(1)} MB`;
    }

    function parentPath(value) {
      const parts = value.split('/').filter(Boolean);
      parts.pop();
      return parts.join('/') || '.';
    }

    function sendToChat(text) {
      window.parent.postMessage({ source: 'skelp-micro-app', type: 'chat.send', payload: { text } }, window.location.origin);
    }

    function render(entries) {
      if (!entries.length) {
        content.innerHTML = '<div class="empty">This folder is empty.</div>';
        return;
      }
      const list = document.createElement('ul');
      list.className = 'files';
      for (const entry of entries) {
        const item = document.createElement('li');
        const button = document.createElement('button');
        button.className = 'entry';
        button.innerHTML = `<span class="entry-icon">${entry.type === 'directory' ? '+' : '-'}</span><span class="entry-name"></span><span class="entry-meta"></span>`;
        button.querySelector('.entry-name').textContent = entry.name;
        button.querySelector('.entry-meta').textContent = entry.type === 'directory' ? 'folder' : formatSize(entry.size);
        button.addEventListener('click', () => entry.type === 'directory' ? load(entry.path) : sendToChat(`Open and inspect ${entry.path}`));
        item.appendChild(button);
        list.appendChild(item);
      }
      content.replaceChildren(list);
    }

    async function load(nextPath) {
      content.innerHTML = '<div class="empty">Loading...</div>';
      try {
        const response = await fetch(`/api/files?path=${encodeURIComponent(nextPath)}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Unable to read directory');
        currentPath = data.path;
        pathLabel.textContent = currentPath === '.' ? 'Working directory' : currentPath;
        backButton.disabled = currentPath === '.';
        render(data.entries);
      } catch (error) {
        content.innerHTML = `<div class="error">${error.message}</div>`;
      }
    }

    backButton.addEventListener('click', () => load(parentPath(currentPath)));
    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin) return;
      const data = event.data;
      if (data?.source !== 'skelp' || data.type !== 'theme') return;
      for (const [name, value] of Object.entries(data.payload.cssVariables)) document.documentElement.style.setProperty(name, value);
    });
    load('.');
  </script>
</body>
</html>
